name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check (also catches missing translation keys)
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Single-file demo build
        run: npm run build:demo
      - uses: actions/upload-artifact@v4
        with:
          name: armen-care-demo
          path: dist-demo/index.html
